name: Build Android engine

# Host matrix (WP-2.6 §3.1): linux-x64 is the primary host and builds
# libflutter.so, the embedding jar and its gen_snapshot under one build_id.
# Secondary hosts build only their gen_snapshot from the same engine commit
# and patches and attach it to the primary release on their own runner, where
# `pair_device.py` records an honest device result (passed, or skipped only
# when adb sees no device). The primary release alone is publishable, so a
# missing or failed secondary runner never blocks a Linux release; its
# gen_snapshot is then simply absent from that release.
# macos-arm64 is implemented but has no runner yet; add it to the `hosts`
# matrix once a runner is registered.

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter stable version, or all for supported_versions.txt
        required: true
        type: string
      publish:
        description: Upload to a Flutter release already created by the user
        type: boolean
        default: false
      abi:
        description: Android ABI (only arm64-v8a is supported)
        required: false
        default: arm64-v8a
        type: string

permissions:
  contents: read

concurrency:
  group: engine-builder
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: select
        env:
          REQUESTED_VERSION: ${{ inputs.flutter_version }}
          REQUESTED_ABI: ${{ inputs.abi }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          versions = pathlib.Path('supported_versions.txt').read_text().splitlines()
          assert versions and len(versions) == len(set(versions))
          assert all(re.fullmatch(r'\d+\.\d+\.\d+', v) for v in versions)
          assert os.environ['REQUESTED_ABI'] == 'arm64-v8a', 'Unsupported ABI'
          requested = os.environ['REQUESTED_VERSION']
          assert requested == 'all' or requested in versions, 'Unsupported Flutter version'
          selected = versions if requested == 'all' else [requested]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'flutter_version': selected}) + '\n')
          PY

  build:
    needs: versions
    runs-on: [self-hosted, Linux, X64, engine-builder]
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      FLUTTER_PATCHER_ENGINE_HOME: ${{ vars.ENGINE_WORK_DIR }}
      FLUTTER_VERSION: ${{ matrix.flutter_version }}
      ABI: ${{ inputs.abi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test pipeline assertions
        run: python3 -m unittest discover -s engine/scripts/test -v
      - name: Build, package and verify
        id: build
        run: |
          output="$RUNNER_TEMP/engine-release-$FLUTTER_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "release_dir=$output" >> "$GITHUB_OUTPUT"
          bash engine/scripts/build.sh "$FLUTTER_VERSION" "$ABI" --out "$output"
      - name: Preserve the primary release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-primary-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 14

  host_snapshot:
    needs: [versions, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        flutter_version: ${{ fromJSON(needs.versions.outputs.matrix).flutter_version }}
        host:
          - key: windows-x64
            labels: [self-hosted, Windows, X64, engine-builder]
    runs-on: ${{ matrix.host.labels }}
    timeout-minutes: 360
    env:
      FLUTTER_PATCHER_ENGINE_HOME: ${{ vars.ENGINE_WORK_DIR }}
      FLUTTER_VERSION: ${{ matrix.flutter_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test pipeline assertions
        shell: bash
        run: python -m unittest discover -s engine/scripts/test -v
      - name: Build and verify the host gen_snapshot
        id: snapshot
        shell: bash
        run: |
          output="$RUNNER_TEMP/gen-snapshot-${{ matrix.host.key }}-$FLUTTER_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "bundle_dir=$output" >> "$GITHUB_OUTPUT"
          python engine/scripts/host_snapshot.py build "$FLUTTER_VERSION" --out "$output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gen-snapshot-${{ matrix.host.key }}-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.snapshot.outputs.bundle_dir }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: engine-primary-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Attach to the primary release and pair on a device when one is connected
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.snapshot.outputs.bundle_dir }}
        run: |
          python engine/scripts/host_snapshot.py attach "$RUNNER_TEMP/release" "$BUNDLE_DIR"
          python engine/scripts/artifacts.py validate "$RUNNER_TEMP/release" --publishable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ always() && inputs.publish == true && needs.build.result == 'success' }}
    needs: [versions, build, host_snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Take the merged release when every host attached, else the primary release
        id: pick
        env:
          HOSTS_RESULT: ${{ needs.host_snapshot.result }}
        run: |
          if [ "$HOSTS_RESULT" = success ]; then
            echo "name=engine-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::secondary host result: $HOSTS_RESULT; publishing the primary (linux-x64) release only"
            echo "name=engine-primary-${{ matrix.flutter_version }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ steps.pick.outputs.name }}
          path: ${{ runner.temp }}/release
      - name: Upload to existing Flutter release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/scripts/github_release.py publish "$RUNNER_TEMP/release"
