name: Pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Python pipeline is host-independent by design;
    # every declared build host runs the same unit tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - shell: bash
        run: python3 -m unittest discover -s engine/scripts/test -v
      - shell: bash
        run: python3 -m unittest discover -s tools/release/test -v
      - shell: bash
        run: python3 tools/generators/protocol_set/embed_definitions.py --check
      - name: Check shell syntax
        if: ${{ runner.os == 'Linux' }}
        run: |
          for script in engine/scripts/*.sh; do bash -n "$script"; done
